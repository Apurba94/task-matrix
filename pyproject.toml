[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "task-matrix"
version = "0.1.0"
description = "Eisenhower urgent/important task matrix CLI with JSON storage."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
task-matrix = "task_matrix.cli:main"

[tool.setuptools]
packages = ["task_matrix"]
